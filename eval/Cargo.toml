[package]
name = "axkit-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Run agent harnesses against a task set and measure success, turns, tokens and cost"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "warn"
cast_possible_truncation = "warn"
needless_pass_by_value = "warn"
fn_params_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
wildcard_imports = "warn"
return_self_not_must_use = "warn"
