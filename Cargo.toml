[package]
name = "axkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Agent-first CLI building blocks shared by idax and bnx: bounded output, errors, agent detection"
license = "Apache-2.0"
repository = "https://github.com/VibRev/axkit"
keywords = ["cli", "agent", "llm", "reverse-engineering"]
categories = ["command-line-interface"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "error-context"], optional = true }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[features]
default = ["clap"]
# Routes clap's own parse errors through `Failure`, so a usage error looks like
# every other error (CONVENTIONS §6.1) instead of clap's text and exit code 2.
clap = ["dep:clap"]

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "warn"
cast_possible_truncation = "warn"
needless_pass_by_value = "warn"
fn_params_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
wildcard_imports = "warn"
return_self_not_must_use = "warn"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
